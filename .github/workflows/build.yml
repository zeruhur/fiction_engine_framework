name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.1"

      - name: Install fonts
        run: |
          mkdir -p _fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" \
            -o _fonts/Lora.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bital%2Cwght%5D.ttf" \
            -o _fonts/Lora-Italic.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" \
            -o _fonts/Montserrat.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bital%2Cwght%5D.ttf" \
            -o _fonts/Montserrat-Italic.ttf

      - name: Render PDF
        run: quarto render master.qmd --to typst

      - name: Render EPUB
        run: quarto render master.qmd --to epub

      - name: Render ODT
        run: quarto render master.qmd --to odt

      - name: Render MD
        run: quarto render master.qmd --to gfm

      - name: Prepare handbook body
        run: |
          python3 -c "
          import re, sys
          content = open('handbook/fiction_engine_handbook.md').read()
          body = re.sub(r'^---\n.*?\n---\n', '', content, count=1, flags=re.DOTALL)
          open('handbook_body.md', 'w').write(body)
          "

                - name: Render Handbook PDF
                  run: quarto render handbook.qmd --to typst

                - name: Render Handbook EPUB
                  run: quarto render handbook.qmd --to epub

                - name: Render Handbook ODT
                  run: quarto render handbook.qmd --to odt

                - name: Render Handbook MD
                  run: quarto render handbook.qmd --to gfm

                - name: Assemble site
                  run: |
                    mkdir -p _site/downloads
                    cp index.html _site/
                    cp logo.svg _site/
                    cp -r foundation analysis comparative system_thinking limits handbook _site/
                    cp -r _extensions _site/
                    [ -f master.pdf ]  && cp master.pdf  _site/downloads/fiction-engine-framework.pdf  || true
                    [ -f master.epub ] && cp master.epub _site/downloads/fiction-engine-framework.epub || true
                    [ -f master.odt ]  && cp master.odt  _site/downloads/fiction-engine-framework.odt  || true
                    [ -f master.md ]   && cp master.md   _site/downloads/fiction-engine-framework.md   || true
                    [ -f handbook.pdf ]  && cp handbook.pdf  _site/downloads/fiction-engine-handbook.pdf  || true
                    [ -f handbook.epub ] && cp handbook.epub _site/downloads/fiction-engine-handbook.epub || true
                    [ -f handbook.odt ]  && cp handbook.odt  _site/downloads/fiction-engine-handbook.odt  || true
                    [ -f handbook.md ]   && cp handbook.md   _site/downloads/fiction-engine-handbook.md   || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
