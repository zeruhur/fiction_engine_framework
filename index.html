<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction Engine Framework</title>
    
    <!-- 1. Water.css loaded by cdnjs (avoids jsdelivr timing out) -->
    <link rel="stylesheet" href="https://jsdelivr.net">

    <!-- 2. Tufte ET-Book font loaded successfully with full CSS file path -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/typeface-et-book@0.0.2/et-book/et-book.min.css">

    <!-- 3. CSS configuration to force ET-Book and refine the layout -->
    <style>
        /* Global rules applied to the body of the site */
        body {
            font-family: "et-book", Georgia, serif !important;
            font-size: 19px;         /*Perfect editorial size for reading */
            line-height: 1.7;        /*Eye-friendly line spacing */
            color: #111;           /*Dark ink paper essay style */
            max-width: 720px;        /*NARROW THE COLUMN: the text no longer runs across the page */
            margin: 0 auto;          /*CENTER COLUMN on screen */
            padding: 2rem 1rem;      /*Space from edges on mobile */
        }

        /* Force the size of the titles proportionate to the body */
        h1 { font-size: 2.2rem; margin-top: 2rem; }
        h2 { font-size: 1.6rem; margin-top: 1.8rem; }
        h3 { font-size: 1.3rem; margin-top: 1.5rem; }

        /* Navbar rules */
        nav { 
            margin-bottom: 3rem; 
            padding-bottom: 1rem;
            border-bottom: 1px dashed #ccc;
        }
        nav a { 
            margin-right: 25px; 
            cursor: pointer; 
            text-decoration: none; 
            font-style: italic; 
            color: #333;
        }
        nav a:hover { 
            text-decoration: underline; 
            background: none; 
        }
        nav a.active { 
            font-weight: bold; 
            text-decoration: underline; 
        }
    </style>

    <!-- 4. Marked.js library to cdnjs -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <a href="?page=home" id="link-home">Home</a>
        <a href="?page=transparency-threshold" id="link-essay1">The Transparency Threshold</a>
        <a href="?page=four-designs" id="link-essay2">Four Designs, One Framework</a>
        <a href="?page=faction-fiction" id="link-essay3">The Faction and the Fiction</a>
    </nav>

    <!-- Text container -->
    <main id="content">
        <p>Loading...</p>
    </main>

    <script>
        const pages = {
            'home': 'fiction_engine_framework.md',
            'transparency-threshold': 'transparency_threshold_essay.md',
            'four-designs': 'four_designs_one_framework.md',
            'faction-fiction': 'faction_and_fiction_essay.md'
        };

        async function loadMarkdown() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentPage = urlParams.get('page') || 'home';
            const fileName = pages[currentPage] || pages['home'];

            document.getElementById('link-home').classList.toggle('active', currentPage === 'home');
            document.getElementById('link-essay1').classList.toggle('active', currentPage === 'transparency-threshold');
            document.getElementById('link-essay2').classList.toggle('active', currentPage === 'four-designs');
            document.getElementById('link-essay3').classList.toggle('active', currentPage === 'faction-fiction');

            try {
                const response = await fetch(fileName);
                if (!response.ok) throw new Error('File not found');
                
                let markdownText = await response.text();

                // Removes Front Matter if left in .md files
                markdownText = markdownText.replace(/^---[\s\S]+?---/, '');

                // Convert and inject the HTML
                document.getElementById('content').innerHTML = marked.parse(markdownText);
            } catch (error) {
                document.getElementById('content').innerHTML = `<h1>Error</h1><p>Unable to load the requested essay.</p>`;
            }
        }

        loadMarkdown();
    </script>

</body>
</html>
