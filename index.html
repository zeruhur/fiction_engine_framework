<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiction Engine Framework</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@500;600;700;900&display=swap">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --paper:      #f4f0e6;
            --ink:        #1a1714;
            --ink-mid:    #4a4540;
            --ink-soft:   #7a7268;
            --rule:       #ccc4b4;
            --accent:     #7a5c3a;
            --accent-lt:  #c4a87a;
            --max-w:      720px;
            --pad:        2rem;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper:     #1e1d1a;
                --ink:       #ede8de;
                --ink-mid:   #c0b8a8;
                --ink-soft:  #908880;
                --rule:      #3e3c38;
                --accent:    #d4b882;
                --accent-lt: #8a6840;
            }
        }

        html { font-size: 20px; scroll-behavior: smooth; }

        body {
            font-family: "Lora", Georgia, "Times New Roman", serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.72;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── SITE HEADER ─────────────────────────────── */
        .site-header {
            border-bottom: 1px solid var(--rule);
            background: var(--paper);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .site-header-inner {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0.9rem var(--pad);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
        }

        .site-name {
            font-family: "Montserrat", sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-mid);
            text-decoration: none;
            transition: color 0.15s;
            white-space: nowrap;
        }
        .site-name:hover { color: var(--ink); }

        .back-link {
            font-size: 0.85rem;
            color: var(--ink-soft);
            text-decoration: none;
            font-style: italic;
            transition: color 0.15s;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--ink); }

        /* ── INDEX PAGE ──────────────────────────────── */
        .index-wrap {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 0 var(--pad) 5rem;
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0);   }
        }

        .masthead {
            padding: 3.5rem 0 2.8rem;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 0;
        }

        .masthead h1 {
            font-family: "Montserrat", sans-serif;
            font-size: 2.8rem;
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        .masthead .meta {
            margin-top: 0.55rem;
            font-size: 0.88rem;
            color: var(--ink-soft);
            font-style: italic;
        }

        .masthead .intro {
            margin-top: 1.4rem;
            font-size: 1rem;
            color: var(--ink-mid);
            line-height: 1.68;
            max-width: 530px;
        }

        /* Arc section headers */
        .arc-label {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            margin-top: 3rem;
            margin-bottom: 0;
        }

        .arc-label-text {
            font-size: 0.72rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            white-space: nowrap;
        }

        .arc-label-rule {
            flex: 1;
            height: 1px;
            background: var(--rule);
        }

        /* Essay entries */
        .essay-entry {
            display: flex;
            gap: 1.1rem;
            padding: 1.6rem 0;
            border-bottom: 1px solid var(--rule);
            text-decoration: none;
            color: inherit;
            transition: background 0.12s;
            position: relative;
        }

        .essay-entry::before {
            content: '';
            position: absolute;
            left: -var(--pad);
            top: 0;
            bottom: 0;
            width: 0;
            background: var(--accent);
            transition: width 0.15s ease;
        }

        .essay-entry:hover .entry-title {
            color: var(--accent);
        }

        .entry-num {
            font-size: 0.75rem;
            color: var(--accent-lt);
            letter-spacing: 0.06em;
            padding-top: 0.32rem;
            min-width: 2.2rem;
            font-style: normal;
            line-height: 1;
        }

        .entry-body { flex: 1; }

        .entry-title {
            font-family: "Montserrat", sans-serif;
            font-size: 1.1rem;
            line-height: 1.28;
            font-weight: 700;
            transition: color 0.15s;
        }

        .entry-subtitle {
            font-size: 0.88rem;
            color: var(--ink-soft);
            font-style: italic;
            margin-top: 0.18rem;
            line-height: 1.45;
        }

        .entry-desc {
            font-size: 0.87rem;
            color: var(--ink-mid);
            margin-top: 0.55rem;
            line-height: 1.58;
        }

        /* ── ESSAY PAGE ──────────────────────────────── */
        .essay-wrap {
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 2.8rem var(--pad) 5rem;
            animation: fadeUp 0.35s ease both;
        }

        .essay-wrap h1 {
            font-family: "Montserrat", sans-serif;
            font-size: 2.2rem;
            line-height: 1.18;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.3rem;
        }

        .essay-wrap h2 {
            font-family: "Montserrat", sans-serif;
            font-size: 1.28rem;
            font-weight: 600;
            margin-top: 2.4rem;
            margin-bottom: 0.7rem;
            line-height: 1.3;
        }

        .essay-wrap h3 {
            font-family: "Montserrat", sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            font-style: normal;
            margin-top: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .essay-wrap p {
            margin-bottom: 1.05rem;
            text-align: justify;
        }

        .essay-wrap p em {
            font-style: italic;
        }

        .essay-wrap strong {
            font-weight: bold;
        }

        .essay-wrap ul, .essay-wrap ol {
            margin: 0.2rem 0 1.1rem 1.6rem;
        }

        .essay-wrap li { margin-bottom: 0.28rem; }

        .essay-wrap blockquote {
            border-left: 2px solid var(--accent-lt);
            padding-left: 1.2rem;
            color: var(--ink-mid);
            margin: 1.6rem 0;
            font-style: italic;
        }

        .essay-wrap hr {
            border: none;
            border-top: 1px solid var(--rule);
            margin: 2.6rem 0;
        }

        /* Essay nav footer */
        .essay-footer {
            margin-top: 4rem;
            padding-top: 1.4rem;
            border-top: 1px solid var(--rule);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            font-size: 0.87rem;
            color: var(--ink-soft);
        }

        .essay-footer a {
            color: var(--ink-soft);
            text-decoration: none;
            font-style: italic;
            transition: color 0.15s;
            line-height: 1.4;
        }
        .essay-footer a:hover { color: var(--accent); }

        .footer-prev { text-align: left;  flex: 1; }
        .footer-next { text-align: right; flex: 1; }

        /* Series tag on essays */
        .essay-series-tag {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.4rem;
        }

        /* Download links */
        .downloads {
            margin-top: 1.3rem;
            display: flex;
            gap: 1.4rem;
            flex-wrap: wrap;
        }

        .download-link {
            font-size: 0.82rem;
            color: var(--ink-soft);
            text-decoration: none;
            font-style: italic;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 0.1rem;
            transition: color 0.15s, border-color 0.15s;
        }

        .download-link:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .dl-fmt {
            font-style: normal;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* ── STATES ──────────────────────────────────── */
        .loading-msg {
            color: var(--ink-soft);
            font-style: italic;
            padding: 3rem 0;
        }

        /* ── SITE FOOTER ─────────────────────────────── */
        .site-footer {
            border-top: 1px solid var(--rule);
            max-width: var(--max-w);
            margin: 0 auto;
            padding: 1.4rem var(--pad) 2.8rem;
            font-size: 0.8rem;
            color: var(--ink-soft);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .site-footer a {
            color: var(--ink-soft);
            text-decoration: none;
            border-bottom: 1px solid var(--rule);
            transition: color 0.15s, border-color 0.15s;
        }

        .site-footer a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ── RESPONSIVE ──────────────────────────────── */
        @media (max-width: 560px) {
            html { font-size: 17px; }
            :root { --pad: 1.2rem; }
            .masthead h1 { font-size: 2.1rem; }
            .essay-wrap h1 { font-size: 1.85rem; }
            .entry-num { display: none; }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.4/lib/marked.umd.min.js"></script>
</head>
<body>

<header class="site-header">
    <div class="site-header-inner">
        <a href="?" class="site-name">Fiction Engine Framework</a>
        <span id="back-slot"></span>
    </div>
</header>

<div id="root"></div>

<footer class="site-footer">
    <a href="https://example.com">Fiction Engine Framework</a> © 2026 by <a href="https://example.com">Roberto Bisceglie</a> is licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/">Creative Commons Attribution-ShareAlike 4.0 International</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width:1em;max-height:1em;margin-left:.2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width:1em;max-height:1em;margin-left:.2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width:1em;max-height:1em;margin-left:.2em;">
</footer>

<script>
const ESSAYS = [
    {
        id: 'framework',
        file: 'foundation/fiction_engine_framework.md',
        title: 'Fiction Engine',
        subtitle: 'A Design Framework for Tabletop RPGs',
        desc: 'The core document. Defines the paradigm, its structural commitments, failure modes, and design criteria.',
        num: '—',
        arc: null
    },
    {
        id: 'the-bet',
        file: 'foundation/the_bet.md',
        title: 'The Bet',
        subtitle: 'An Introduction to the Essay Series',
        desc: 'Introduces the terms the series uses precisely and stakes the central claim the essays develop.',
        num: '—',
        arc: null
    },
    {
        id: 'transparency-threshold',
        file: 'analysis/transparency_threshold_essay.md',
        title: 'The Transparency Threshold',
        subtitle: 'Abstraction, Mediation, and the Limits of Fiction Engine Design',
        desc: 'Where fiction engine design reaches its edges — and what kinds of abstraction threaten or preserve the fiction.',
        num: '01',
        arc: 'analysis'
    },
    {
        id: 'four-designs',
        file: 'analysis/four_designs_one_framework.md',
        title: 'Four Designs, One Framework',
        subtitle: 'Applying the Fiction Engine Analysis in Practice',
        desc: 'Applies the framework as an evaluative lens across four real game designs with different structural choices.',
        num: '02',
        arc: 'analysis'
    },
    {
        id: 'faction-fiction',
        file: 'analysis/faction_and_fiction_essay.md',
        title: 'The Faction and the Fiction',
        subtitle: 'What Open Strategy Games Reveal at the Fiction Engine\'s Edge',
        desc: 'Uses faction and open-table play to test where the fiction engine\'s commitments hold and where they strain.',
        num: '03',
        arc: 'analysis'
    },
    {
        id: 'same-thinness',
        file: 'comparative/same_thinness_different_purposes.md',
        title: 'The Same Thinness, Different Purposes',
        subtitle: 'Why OSR/FKR and Fiction Engine Designs Converge Procedurally and Diverge Structurally',
        desc: 'Examines why two design families that look similar procedurally are doing fundamentally different things.',
        num: '—',
        arc: 'comparative'
    },
    {
        id: 'fiction-memory',
        file: 'system_thinking/fiction_and_memory.md',
        title: 'Fiction and Memory',
        subtitle: 'The Structural Difference Between Accumulation and Reset',
        desc: 'Foundation essay for the systems arc. Examines how fiction accumulates or resets across time and what that implies for design.',
        num: '04',
        arc: 'systems'
    },
    {
        id: 'emergence-condition',
        file: 'system_thinking/emergence_condition.md',
        title: 'The Emergence Condition',
        subtitle: 'Why Thin Mediation Enables What Thick Procedure Suppresses',
        desc: 'Argues that the fiction engine\'s structural thinness is the condition for emergence, not a concession to it.',
        num: '05',
        arc: 'systems'
    },
    {
        id: 'threshold-trajectory',
        file: 'system_thinking/threshold_trajectory.md',
        title: 'The Threshold as Trajectory',
        subtitle: 'Designing a System That Changes Its Own Properties Through Use',
        desc: 'Application essay. Asks what it means for a game system to evolve through play itself.',
        num: '06',
        arc: 'systems'
    },
    {
        id: 'properties-behaviors',
        file: 'system_thinking/properties_behaviors.md',
        title: 'Properties and Behaviors',
        subtitle: 'What the Fiction Engine Framework Gets Right, and What It Can\'t Say',
        desc: 'A self-critical examination of the framework\'s explanatory limits — what it captures and what escapes it.',
        num: '07',
        arc: 'systems'
    },
    {
        id: 'one-agent-loop',
        file: 'system_thinking/one_agent_one_loop.md',
        title: 'One Agent, One Loop',
        subtitle: 'The Solo Fiction Engine as a Distinct Design Problem',
        desc: 'Examines what changes when the fiction engine runs with a single player and no referee.',
        num: '08',
        arc: 'systems'
    },
    {
        id: 'limits-framing',
        file: 'limits/essay_limits_framing.md',
        title: 'What the Engine Is For',
        subtitle: 'On the Limits of the Fiction Engine Paradigm',
        desc: 'Opens the limits sub-series. Names the structural logic of the fiction engine and identifies the experiences it reshapes or forecloses.',
        num: '—',
        arc: 'limits'
    },
    {
        id: 'limits-powerlessness',
        file: 'limits/limits_essay1_powerlessness.md',
        title: 'Powerlessness',
        subtitle: 'The Experience the Engine Cannot Produce',
        desc: 'Examines why the fiction engine cannot produce dread — the sensation of narrowing agency — even when running horror content.',
        num: '09',
        arc: 'limits'
    },
    {
        id: 'limits-fixed-answer',
        file: 'limits/limits_essay2_the_fixed_answer.md',
        title: 'The Fixed Answer',
        subtitle: 'Convergence, Closure, and What Mystery Requires',
        desc: 'Examines why the fiction engine cannot produce mystery\'s epistemic structure: convergence toward an answer that exists independently of play.',
        num: '10',
        arc: 'limits'
    },
    {
        id: 'limits-weight-system',
        file: 'limits/limits_essay3_weight_of_system.md',
        title: 'The Weight of the System',
        subtitle: 'When Procedure Is the Experience',
        desc: 'Examines why a fiction engine that succeeds at its own goal makes procedural tension structurally impossible.',
        num: '11',
        arc: 'limits'
    },
    {
        id: 'limits-above-situation',
        file: 'limits/limits_essay4_above_the_situation.md',
        title: 'Above the Situation',
        subtitle: 'What Strategic Depth Requires and Why the Engine Refuses It',
        desc: 'Examines why strategic depth requires a positional relationship to the fiction that the fiction engine structurally refuses.',
        num: '12',
        arc: 'limits'
    },
    {
        id: 'limits-building-nothing',
        file: 'limits/limits_essay5_building_into_nothing.md',
        title: 'Building Into Nothing',
        subtitle: 'Character Construction and the Object Thin Procedure Dissolves',
        desc: 'Examines why the fiction engine dissolves character-as-system, the structural object that character construction as a primary engagement requires.',
        num: '13',
        arc: 'limits'
    },
    {
        id: 'glossary',
        file: 'foundation/glossary.md',
        title: 'Glossary',
        subtitle: 'Terms as Used in This Series',
        desc: 'Precise definitions for the terms the essays use technically: fiction, fictional state, overhead, diegetic, and others.',
        num: '—',
        arc: 'appendix'
    }
];

const ARC_LABELS = {
    analysis:    'Analysis Arc',
    comparative: 'Comparative',
    systems:     'Systems Thinking Arc',
    limits:      'Limits Arc',
    appendix:    'Appendix'
};

function byId(id)    { return ESSAYS.find(e => e.id === id) || ESSAYS[0]; }
function indexOf(id) { return ESSAYS.findIndex(e => e.id === id); }

// ── INDEX ───────────────────────────────────────────
function renderIndex() {
    document.title = 'Fiction Engine Framework';
    document.getElementById('back-slot').innerHTML = '';

    const foundation   = ESSAYS.filter(e => !e.arc);
    const analysis     = ESSAYS.filter(e => e.arc === 'analysis');
    const comparative  = ESSAYS.filter(e => e.arc === 'comparative');
    const systems      = ESSAYS.filter(e => e.arc === 'systems');
    const limits       = ESSAYS.filter(e => e.arc === 'limits');
    const appendix     = ESSAYS.filter(e => e.arc === 'appendix');

    function entryHTML(e) {
        return `<a class="essay-entry" href="?page=${e.id}">
            <span class="entry-num">${e.num}</span>
            <div class="entry-body">
                <div class="entry-title">${e.title}</div>
                <div class="entry-subtitle">${e.subtitle}</div>
                <div class="entry-desc">${e.desc}</div>
            </div>
        </a>`;
    }

    function arcSection(label, items) {
        if (!items.length) return '';
        return `<div class="arc-label">
            <span class="arc-label-text">${label}</span>
            <span class="arc-label-rule"></span>
        </div>
        ${items.map(entryHTML).join('')}`;
    }

    document.getElementById('root').innerHTML = `
        <div class="index-wrap">
            <div class="masthead">
                <h1>Fiction Engine<br>Framework</h1>
                <p class="meta">Roberto Bisceglie &middot; Version 1.0 &middot; May 2026</p>
                <p class="intro">A design framework for tabletop RPGs treating play as a system for producing, sustaining, and transforming fiction with minimal friction. One framework document, nine companion essays, and a glossary.</p>
                <div class="downloads">
                    <a class="download-link" href="downloads/fiction-engine-framework.pdf" download>Download <span class="dl-fmt">PDF</span></a>
                    <a class="download-link" href="downloads/fiction-engine-framework.epub" download>Download <span class="dl-fmt">EPUB</span></a>
                    <a class="download-link" href="downloads/fiction-engine-framework.odt" download>Download <span class="dl-fmt">ODT</span></a>
                </div>
            </div>

            ${arcSection('Foundation', foundation)}
            ${arcSection(ARC_LABELS.analysis, analysis)}
            ${arcSection(ARC_LABELS.comparative, comparative)}
            ${arcSection(ARC_LABELS.systems, systems)}
            ${arcSection(ARC_LABELS.limits, limits)}
            ${arcSection(ARC_LABELS.appendix, appendix)}
        </div>`;
}

// ── ESSAY ────────────────────────────────────────────
async function renderEssay(id) {
    const essay = byId(id);
    const idx   = indexOf(id);
    const prev  = idx > 0              ? ESSAYS[idx - 1] : null;
    const next  = idx < ESSAYS.length - 1 ? ESSAYS[idx + 1] : null;

    document.title = `${essay.title} — Fiction Engine Framework`;
    document.getElementById('back-slot').innerHTML =
        `<a href="?" class="back-link">&#8592; All essays</a>`;

    document.getElementById('root').innerHTML =
        `<div class="essay-wrap"><p class="loading-msg">Loading&hellip;</p></div>`;

    try {
        const res = await fetch(essay.file);
        if (!res.ok) throw new Error('not found');
        let md = await res.text();
        md = md.replace(/^---[\s\S]+?---/, '');

        const arcTag = essay.arc
            ? `<span class="essay-series-tag">${ARC_LABELS[essay.arc]}</span>`
            : '';

        const footerPrev = prev
            ? `<a class="footer-prev" href="?page=${prev.id}">&#8592; ${prev.title}</a>`
            : `<a class="footer-prev" href="?">&#8592; All essays</a>`;

        const footerNext = next
            ? `<a class="footer-next" href="?page=${next.id}">${next.title} &#8594;</a>`
            : `<span class="footer-next"></span>`;

        document.getElementById('root').innerHTML = `
            <div class="essay-wrap">
                ${arcTag}
                ${marked.parse(md)}
                <div class="essay-footer">
                    ${footerPrev}
                    ${footerNext}
                </div>
            </div>`;
    } catch {
        document.getElementById('root').innerHTML = `
            <div class="essay-wrap">
                <h2>Essay not found</h2>
                <p>Unable to load the requested file.</p>
            </div>`;
    }
}

// ── ROUTER ───────────────────────────────────────────
function route() {
    const page = new URLSearchParams(window.location.search).get('page');
    if (!page || page === 'home') renderIndex();
    else renderEssay(page);
}

window.addEventListener('popstate', route);
route();
</script>

</body>
</html>
